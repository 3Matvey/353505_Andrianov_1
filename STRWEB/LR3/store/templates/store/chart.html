{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Графики — ЛР3 (Chart.js)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <style>
    .controls { margin: 1rem 0; }
    #chartWrap { max-width:900px; margin: 0 auto; }
  </style>
</head>
<body class="p-3">
  <div class="container">
    <h1>Построение графиков (Chart.js) — ЛР3</h1>
    <p>Демонстрация: функция и её ряд (вариант: ln((x+1)/(x-1)) = 2 * sum_{k=0..} 1/((2k+1) x^{2k+1}), |x|&gt;1)</p>

    <div class="controls row g-2">
      <div class="col-auto">
        <label class="form-label">N (число членов ряда)</label>
        <input id="termsN" class="form-control" type="number" value="5" min="1" max="200">
      </div>
      <div class="col-auto">
        <label class="form-label">X min</label>
        <input id="xMin" class="form-control" type="number" value="1.2" step="0.1">
      </div>
      <div class="col-auto">
        <label class="form-label">X max</label>
        <input id="xMax" class="form-control" type="number" value="10" step="0.1">
      </div>
      <div class="col-auto align-self-end">
        <button id="redrawBtn" class="btn btn-primary">Построить</button>
      </div>
      <div class="col-auto align-self-end">
        <button id="downloadBtn" class="btn btn-secondary">Сохранить PNG</button>
      </div>
    </div>

    <div id="chartWrap">
      <canvas id="chartCanvas" width="900" height="450"></canvas>
    </div>

    <div class="mt-3">
      <p><strong>Подписи:</strong> синяя линия — точное значение F(x) (Math), оранжевая — сумма первых N членов ряда.</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="{% static 'js/chartTask.js' %}"></script>
</body>
</html>
