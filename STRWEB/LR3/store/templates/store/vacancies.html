{% extends "base.html" %}
{% block title %}Вакансии — Zoo Shop{% endblock %}

{% block content %}
  <h1>Вакансии</h1>
  <div class="vacancies-container clearfix">
    {% for v in vacancies %}
      <div class="vacancy-card {% cycle 'v-left' 'v-right' %}">
        <h4>{{ v.title }}</h4>
        <p>{{ v.description|linebreaks }}</p>
        <small class="text-muted">Опубликовано: {{ v.posted_at|date:"Y-m-d" }}</small>
      </div>
    {% empty %}
      <p class="text-muted">Никаких открытых вакансий нет.</p>
    {% endfor %}
  </div>
{% endblock %}
