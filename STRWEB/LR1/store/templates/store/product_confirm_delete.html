{% extends "base.html" %}
{% block title %}Удалить {{ product.name }}? — Zoo Shop{% endblock %}

{% block content %}
  <h1>Удалить товар «{{ product.name }}»?</h1>
  <p>Вы уверены, что хотите удалить этот товар из каталога?</p>

  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Да, удалить</button>
    <a href="{% url 'product_detail' product.sku %}" class="btn btn-secondary">Отмена</a>
  </form>
{% endblock %}
